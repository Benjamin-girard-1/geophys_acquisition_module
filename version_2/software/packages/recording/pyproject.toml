[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geophys-recording"
version = "0.1.0"
description = "Portable decoders for Geophys recording files"
requires-python = ">=3.10"

[project.optional-dependencies]
numpy = ["numpy>=1.26,<3"]

[tool.setuptools]
packages = ["geophys_recording"]
