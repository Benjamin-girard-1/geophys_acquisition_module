[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geophys-host"
version = "0.1.0"
description = "Device-control host for the Geophys acquisition module"
requires-python = ">=3.10"
dependencies = [
    "geophys-data>=0.1,<0.2",
    "pyserial>=3.5,<4",
    "matplotlib>=3.8,<4",
    "bleak>=1.0,<4",
]

[project.scripts]
geophys-host = "geophys_host.gui:main"
geophys-host-cli = "geophys_host.cli:entrypoint"

[tool.setuptools]
packages = ["geophys_host"]
