[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geophys-dev-tools"
version = "0.1.0"
description = "Developer diagnostics for Geophys SD-card recordings"
requires-python = ">=3.10"
dependencies = [
    "geophys-recording>=0.1,<0.2",
    "numpy>=1.26,<3",
    "PySide6-Essentials>=6.7,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "scipy>=1.11,<2",
]

[project.scripts]
geophys-plot = "geophys_dev_tools.plot:entrypoint"
geophys-bin-to-csv = "geophys_dev_tools.convert:entrypoint"

[tool.setuptools]
packages = ["geophys_dev_tools"]
